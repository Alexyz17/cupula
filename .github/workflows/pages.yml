name: Demo en GitHub Pages

# Publica el frontend en modo demo: la API se simula en el navegador con MSW, así que no hace falta servidor.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm test

      - name: Build de la demo
        run: npm run build:demo
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      # GitHub Pages no sabe de rutas de una SPA: 404.html sirve la misma app para /equipos/1, /mis-reservas, etc.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
